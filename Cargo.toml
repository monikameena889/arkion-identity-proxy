[package]
name = "arkion-identity-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = "0.8"
base64 = "0.22"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
governor = "0.10.4"
hex = "0.4.3"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "server-graceful", "client-legacy", "http1", "http2", "service"] }
rcgen = "0.14.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "serde", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4"] }
x509-parser = "0.18.1"

[dev-dependencies]
futures-util = "0.3.34"
tempfile = "3.27.0"
